---
name: Delta-V CI
run-name: "Delta-V CI: Build, Test, Package, and Publish"

on:
  push:
    branches:
      - 'release-*'
      - 'ci/*'
      - 'development/*'
    tags:
      - 'v*'
      - 'delta-v-*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Workflow-level permissions define the ceiling for all calling jobs.
# For reusable workflow calls, job-level permissions cannot exceed these.
# Individual jobs below further restrict their own scope as needed.
# contents: write  - package-publish needs this to create GitHub releases
# packages: write  - package-publish needs this to push OCI images to GHCR
# checks: write    - test jobs need this to publish JUnit check reports
# actions: write   - all jobs need this for artifact upload/download
permissions:
  contents: write
  packages: write
  checks: write
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      actions: write

  unit-tests:
    needs: build
    uses: ./.github/workflows/test-unit.yml
    permissions:
      contents: read
      checks: write
      actions: write

  integration-tests:
    needs: unit-tests
    uses: ./.github/workflows/test-integration.yml
    permissions:
      contents: read
      checks: write
      actions: write

  e2e-tests:
    needs: unit-tests
    uses: ./.github/workflows/test-e2e.yml
    permissions:
      contents: read
      checks: write
      actions: write

  package-publish:
    needs: [integration-tests, e2e-tests]
    uses: ./.github/workflows/package-publish.yml
    permissions:
      contents: write
      packages: write
      actions: write
    secrets: inherit
