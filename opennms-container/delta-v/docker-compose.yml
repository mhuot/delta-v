---
# Delta-V: OpenNMS microservice-mode deployment (19 services)
# db-init (schema migration, runs once) + Webapp + Minion
# + Alarmd + Pollerd + Collectd + Rtcd
# + Discovery + Trapd + Syslogd + Ticketer + EventTranslator + Enlinkd + Scriptd
# + Provisiond + Bsmd + PerspectivePollerd + Telemetryd
#
# Images: Uses Delta-V layered images (opennms/*-deltav) which bake all
# modified JARs and features.xml into the image. Build with: ./build.sh deltav
# Per-service config overlays remain as local bind mounts.
#
# Usage:
#   docker compose up -d
#   docker compose ps        # wait for all services to be healthy
#   open http://localhost:8980/opennms  (admin/admin)

services:

  postgres:
    image: postgres:15
    command: ["-c", "max_connections=350"]
    environment:
      POSTGRES_DB: opennms
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth=md5
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennms -d opennms"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "16"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "delta-v-kafka-cluster"
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Database schema initialization — standalone Spring Boot app that runs
  # Liquibase migrations, then exits. All services that need PostgreSQL
  # should depend on this with condition: service_completed_successfully.
  db-init:
    image: opennms/db-init:${VERSION}
    container_name: delta-v-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENNMS_DBINIT_ADMIN_URL: jdbc:postgresql://postgres:5432/template1
      OPENNMS_DBINIT_ADMIN_USER: opennms
      OPENNMS_DBINIT_ADMIN_PASSWORD: opennms
      OPENNMS_DBINIT_DATABASE_NAME: opennms
      OPENNMS_DBINIT_DATABASE_USER: opennms
      OPENNMS_DBINIT_DATABASE_PASSWORD: opennms
      OPENNMS_DBINIT_CREATE_USER: "false"
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m

  snmp-agent:
    build: ./mock-snmp-agent
    container_name: delta-v-snmp-agent
    hostname: snmp-agent
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      retries: 3

  minion:
    image: opennms/minion-deltav:${VERSION}
    container_name: delta-v-minion
    hostname: minion-default-01
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      MINION_ID: minion-default-01
      MINION_LOCATION: Default
      KAFKA_IPC_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -Djava.security.egd=file:/dev/./urandom
    volumes:
      - minion-data:/opt/minion/data
    ports:
      - "8301:8201"
      - "11162:1162/udp"
      - "1514:1514/udp"
    healthcheck:
      # Check Kafka RPC/Sink/Twin connectivity via the health API.
      # Skip the Echo RPC passive check (requires probes from monolithic OpenNMS)
      # and the bundle check (some bundles have unresolved optional deps).
      # If all 3 Kafka connections show "Success", Minion can process RPC requests.
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8181/minion/rest/health?tag=broker' | grep -o '\"Success\"' | wc -l | grep -q '[3-9]'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  pollerd:
    profiles: [lite, full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-pollerd
    hostname: pollerd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms512m -Xmx1g
        -XX:MaxMetaspaceSize=512m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=4
        -Dorg.opennms.core.ipc.rpc.kafka.bootstrap.servers=kafka:9092
        -Dorg.opennms.core.ipc.rpc.force-remote=true
        -Dorg.opennms.core.ipc.twin.kafka.bootstrap.servers=kafka:9092
    volumes:
      - pollerd-data:/opt/sentinel/data
      - ./pollerd-daemon-overlay/etc:/opt/sentinel-etc-overlay:ro
    ports:
      - "8103:8181"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  collectd:
    profiles: [lite, full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-collectd
    hostname: collectd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms512m -Xmx1g
        -XX:MaxMetaspaceSize=512m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=5
        -Dorg.opennms.core.ipc.rpc.kafka.bootstrap.servers=kafka:9092
        -Dorg.opennms.core.ipc.rpc.force-remote=true
    volumes:
      - collectd-data:/opt/sentinel/data
      - ./collectd-daemon-overlay/etc:/opt/sentinel-etc-overlay:ro
    ports:
      - "8104:8181"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  discovery:
    profiles: [passive, full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-discovery
    hostname: discovery
    entrypoint: []
    command: ["java", "-Xms256m", "-Xmx512m", "-jar", "/opt/daemon-boot-discovery.jar"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENNMS_HOME: /opt/deltav
      INTERFACE_NODE_CACHE_REFRESH_MS: "15000"
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "24"
      RPC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RPC_KAFKA_FORCE_REMOTE: "true"
    volumes:
      - ./discovery-overlay/etc:/opt/deltav/etc:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  trapd:
    profiles: [passive, full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-trapd
    hostname: trapd
    entrypoint: []
    command: ["java", "-Xms256m", "-Xmx512m", "-jar", "/opt/daemon-boot-trapd.jar"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-trapd
      KAFKA_SINK_CONSUMER_GROUP: opennms-trapd-sink
      OPENNMS_HOME: /opt/deltav
      INTERFACE_NODE_CACHE_REFRESH_MS: "15000"
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "20"
    volumes:
      - ./trapd-overlay/etc:/opt/deltav/etc:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  syslogd:
    profiles: [passive, full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-syslogd
    hostname: syslogd
    entrypoint: []
    command: ["java", "-Xms256m", "-Xmx512m", "-jar", "/opt/daemon-boot-syslogd.jar"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-syslogd
      KAFKA_SINK_CONSUMER_GROUP: opennms-syslogd-sink
      OPENNMS_HOME: /opt/deltav
      INTERFACE_NODE_CACHE_REFRESH_MS: "15000"
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "21"
    volumes:
      - ./syslogd-overlay/etc:/opt/deltav/etc:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s


  eventtranslator:
    profiles: [passive, full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-eventtranslator
    hostname: eventtranslator
    entrypoint: []
    command: ["java", "-Xms256m", "-Xmx512m", "-jar", "/opt/daemon-boot-eventtranslator.jar"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-eventtranslator
      OPENNMS_HOME: /opt/deltav
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "22"
    volumes:
      - ./eventtranslator-overlay/etc:/opt/deltav/etc:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  enlinkd:
    profiles: [full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-enlinkd
    hostname: enlinkd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=14
        -Dorg.opennms.core.ipc.rpc.kafka.bootstrap.servers=kafka:9092
        -Dorg.opennms.core.ipc.rpc.force-remote=true
    volumes:
      - enlinkd-data:/opt/sentinel/data
      - ./enlinkd-overlay/etc:/opt/sentinel-etc-overlay:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  scriptd:
    profiles: [full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-scriptd
    hostname: scriptd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=15
    volumes:
      - scriptd-data:/opt/sentinel/data
      - ./scriptd-overlay/etc:/opt/sentinel-etc-overlay:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  provisiond:
    profiles: [lite, passive, full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-provisiond
    hostname: provisiond
    entrypoint: []
    command: ["java", "-Xms512m", "-Xmx1g", "-jar", "/opt/daemon-boot-provisiond.jar"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENNMS_HOME: /opt/deltav
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "25"
      RPC_KAFKA_ENABLED: "true"
      RPC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RPC_KAFKA_FORCE_REMOTE: "true"
    volumes:
      - ./provisiond-overlay/etc:/opt/deltav/etc
      - ./etc/imports:/opt/deltav/etc/imports
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  bsmd:
    profiles: [lite, full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-bsmd
    hostname: bsmd
    entrypoint: []
    command: ["java", "-Xms256m", "-Xmx512m", "-jar", "/opt/daemon-boot-bsmd.jar"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-bsmd
      OPENNMS_HOME: /opt/deltav
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "17"
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  perspectivepollerd:
    profiles: [full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-perspectivepollerd
    hostname: perspectivepollerd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=7
        -Dorg.opennms.core.ipc.rpc.kafka.bootstrap.servers=kafka:9092
        -Dorg.opennms.core.ipc.rpc.force-remote=true
    volumes:
      - perspectivepollerd-data:/opt/sentinel/data
      - ./perspectivepollerd-overlay/etc:/opt/sentinel-etc-overlay:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  alarmd:
    profiles: [lite, passive, full]
    image: opennms/daemon-deltav:${VERSION}
    entrypoint: []
    command: ["java", "-Xms512m", "-Xmx1g", "-jar", "/opt/daemon-boot-alarmd.jar"]
    container_name: delta-v-alarmd
    hostname: alarmd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-alarmd
      OPENNMS_HOME: /opt/deltav
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "23"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  telemetryd:
    profiles: [full]
    image: opennms/daemon-deltav:${VERSION}
    container_name: delta-v-telemetryd
    hostname: telemetryd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=18
        -Dorg.opennms.core.ipc.sink.kafka.bootstrap.servers=kafka:9092
        -Dorg.opennms.core.ipc.sink.kafka.group.id=opennms-telemetryd-sink
    volumes:
      - telemetryd-data:/opt/sentinel/data
      - ./telemetryd-overlay/etc:/opt/sentinel-etc-overlay:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  pgdata:
  kafkadata:
  minion-data:
  pollerd-data:
  collectd-data:
  enlinkd-data:
  scriptd-data:
  perspectivepollerd-data:
  telemetryd-data:
